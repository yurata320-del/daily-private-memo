<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface: #101418;
    --surface-container-lowest: #0b0e13;
    --surface-container-low: #191c21;
    --surface-container: #1d2025;
    --surface-container-high: #272a2f;
    --on-surface: #e1e2e9;
    --on-surface-variant: #9aa0ac;
    --outline: #2b3342;
    --primary: #b8c8df;
    --on-primary: #1c2b3d;
    --secondary: #4f5d73;
    --moss: #5e7369;
    --error: #ffb4ab;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--surface);
    color:var(--on-surface);
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:1.5rem 1.25rem 3rem;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:1.5rem;
  }
  header h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .status-card{
    background:var(--surface-container-low);
    border:1px solid rgba(255,255,255,0.04);
    border-radius:2rem;
    padding:1.5rem 1.25rem;
    text-align:center;
    margin-bottom:2rem;
  }
  .status-card .label{
    font-size:13px;
    color:var(--on-surface-variant);
    margin-bottom:0.5rem;
  }
  .status-card .elapsed{
    font-size:32px;
    font-weight:600;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .status-card .since{
    margin-top:0.5rem;
    font-size:12px;
    color:var(--on-surface-variant);
  }
  .log-button{
    appearance:none;
    border:none;
    width:100%;
    padding:1.25rem;
    border-radius:9999px;
    background:var(--primary);
    color:var(--on-primary);
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    cursor:pointer;
    margin-bottom:2rem;
    transition:transform 0.08s ease, opacity 0.15s ease;
  }
  .log-button:active{
    transform:scale(0.97);
    opacity:0.9;
  }
  .history-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:0.75rem;
  }
  .history-header h2{
    font-size:14px;
    font-weight:500;
    color:var(--on-surface-variant);
    margin:0;
  }
  .history-header .count{
    font-size:12px;
    color:var(--on-surface-variant);
  }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    list-style:none;
    margin:0;
    padding:0;
  }
  .history-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface-container);
    border-radius:1rem;
    padding:0.9rem 1rem;
  }
  .history-item .datetime{
    font-size:14px;
  }
  .history-item .interval{
    font-size:12px;
    color:var(--on-surface-variant);
    margin-top:2px;
  }
  .history-item button{
    appearance:none;
    background:transparent;
    border:none;
    color:var(--on-surface-variant);
    cursor:pointer;
    padding:0.4rem;
    border-radius:9999px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .history-item button:hover{
    color:var(--error);
    background:rgba(255,255,255,0.04);
  }
  .empty-state{
    text-align:center;
    color:var(--on-surface-variant);
    font-size:13px;
    padding:2rem 0;
  }
  svg{ display:block; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Daily Log</h1>
    </header>

    <div class="status-card">
      <div class="label">前回の記録からの経過</div>
      <div class="elapsed" id="elapsed">記録がありません</div>
      <div class="since" id="since"></div>
    </div>

    <button class="log-button" id="logButton">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      記録する
    </button>

    <div class="history-header">
      <h2>履歴</h2>
      <span class="count" id="historyCount"></span>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>

<script>
(function(){
  const STORAGE_KEY = 'daily-private-memo.records';

  function loadRecords(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.sort((a,b) => b - a) : [];
    }catch(e){
      return [];
    }
  }

  function saveRecords(records){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }catch(e){ /* storage unavailable, ignore */ }
  }

  let records = loadRecords();

  function formatDateTime(ts){
    const d = new Date(ts);
    const m = d.getMonth()+1, day = d.getDate();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${m}/${day} ${hh}:${mm}`;
  }

  function formatElapsed(ms){
    if (ms < 0) ms = 0;
    const totalMin = Math.floor(ms / 60000);
    const days = Math.floor(totalMin / 1440);
    const hours = Math.floor((totalMin % 1440) / 60);
    const mins = totalMin % 60;
    if (days > 0) return `${days}日 ${hours}時間`;
    if (hours > 0) return `${hours}時間 ${mins}分`;
    return `${mins}分`;
  }

  function formatIntervalLabel(ms){
    const totalMin = Math.floor(ms / 60000);
    const days = Math.floor(totalMin / 1440);
    const hours = Math.floor((totalMin % 1440) / 60);
    if (days > 0) return `間隔: ${days}日${hours > 0 ? ' '+hours+'時間' : ''}`;
    return `間隔: ${hours}時間`;
  }

  const elapsedEl = document.getElementById('elapsed');
  const sinceEl = document.getElementById('since');
  const historyListEl = document.getElementById('historyList');
  const historyCountEl = document.getElementById('historyCount');
  const logButton = document.getElementById('logButton');

  let tickTimer = null;

  function renderStatus(){
    if (records.length === 0){
      elapsedEl.textContent = '記録がありません';
      sinceEl.textContent = '';
      return;
    }
    const last = records[0];
    elapsedEl.textContent = formatElapsed(Date.now() - last);
    sinceEl.textContent = `最終記録: ${formatDateTime(last)}`;
  }

  function renderHistory(){
    historyListEl.innerHTML = '';
    historyCountEl.textContent = records.length > 0 ? `${records.length}件` : '';

    if (records.length === 0){
      const li = document.createElement('li');
      li.className = 'empty-state';
      li.textContent = 'まだ記録がありません。上のボタンから記録を始めましょう。';
      historyListEl.appendChild(li);
      return;
    }

    records.forEach((ts, idx) => {
      const li = document.createElement('li');
      li.className = 'history-item';

      const left = document.createElement('div');
      const dt = document.createElement('div');
      dt.className = 'datetime';
      dt.textContent = formatDateTime(ts);
      left.appendChild(dt);

      if (idx < records.length - 1){
        const interval = document.createElement('div');
        interval.className = 'interval';
        interval.textContent = formatIntervalLabel(ts - records[idx+1]);
        left.appendChild(interval);
      }

      const delBtn = document.createElement('button');
      delBtn.setAttribute('aria-label', '削除');
      delBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-7 0v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      delBtn.addEventListener('click', () => {
        if (confirm('この記録を削除しますか？')){
          records = records.filter(r => r !== ts);
          saveRecords(records);
          render();
        }
      });

      li.appendChild(left);
      li.appendChild(delBtn);
      historyListEl.appendChild(li);
    });
  }

  function render(){
    renderStatus();
    renderHistory();
  }

  function startTicking(){
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(renderStatus, 30000);
  }

  logButton.addEventListener('click', () => {
    records.unshift(Date.now());
    saveRecords(records);
    render();
  });

  render();
  startTicking();
})();
</script>
</body>
</html>
